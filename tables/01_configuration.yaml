study_name: "Texas Heatwave Classification Pilot"   # [CONFIRMED] new, separate
                                                      # from gulf_eda/ per user

geography:
  state: "TX"                                        # [CONFIRMED]
  county_identifier: "county_fips"
  county_boundary_file: "data/raw/census/county_shapefile/tl_2020_us_county.shp"
  boundary_vintage: "2020 TIGER/Line"                 # [INHERITED-DEFAULT] same
                                                       # shapefile already used
                                                       # throughout gulf_eda/
  pilot_counties:                                     # [stated: "counties within
                                                       # Texas at first"; the
                                                       # SPECIFIC 5 below are my
                                                       # proposal, chosen to span
                                                       # TX's climate diversity
                                                       # using this project's own
                                                       # real NOAA/NCEI climate-
                                                       # division crosswalm --
                                                       # swap freely if you want
                                                       # different counties]
    - {county_fips: "48201", name: "Harris (Houston)",      climate_division: "Upper Coast (4108)",   role: "humid coastal"}
    - {county_fips: "48141", name: "El Paso",                climate_division: "Trans-Pecos (4105)",   role: "hot/arid desert"}
    - {county_fips: "48303", name: "Lubbock",                climate_division: "High Plains (4101)",   role: "semi-arid panhandle"}
    - {county_fips: "48453", name: "Travis (Austin)",        climate_division: "South Central (4107)", role: "central/transitional"}
    - {county_fips: "48061", name: "Cameron (Brownsville)",  climate_division: "Lower Valley (4110)",  role: "subtropical humid south"}
  # data completeness verified 2026-07-16 before selection: all 5 counties have
  # 17,350-17,354 valid days out of 17,353-17,354 possible (1979-01-01 through
  # 2026-07), both temperature and humidity sources -- no material gaps.

analysis_period:
  start_date: "2015-01-01"                            # [NEEDS USER DECISION]
  end_date: "2025-12-31"                              #   not explicitly stated
                                                       #   this pilot; matches
                                                       #   the analysis window
                                                       #   already used elsewhere
                                                       #   in this project. Confirm
                                                       #   or override.

reference_period:                                     # [CONFIRMED, with one
                                                       #   open sub-item -- see
                                                       #   note below]
  primary_method: "walk_forward"
  walk_forward_pool_start_year: 1979
  walk_forward_rule: "for analysis year Y, baseline = all years 1979 through Y-1"
  secondary_fixed_comparison:                         # deferred, not built in
    start_year: 1979                                  # this pilot pass -- noted
    end_year: 2014                                     # here per user statement
    status: "not yet built this pass"                 # "the reference period is
                                                        # from 1979-2014"
  spec_default_fixed_window:                          # explicitly deferred by
    start_year: 1981                                  # user ("we will also look
    end_year: 2010                                     # at the 1981-2010
    status: "explicitly deferred -- look at this later, not part of this pilot"

season:                                                # review Issue 4 -- resolved:
                                                        # BOTH produced side by side.
  framing: "year_round_primary_plus_warmseason_companion"
  year_round:
    label_for_events: "persistent_apparent_heat_anomaly"  # NOT "heatwave": only ~47%
                                                        # of year-round heatwave-days
                                                        # fall in Jun-Sep, ~34% in
                                                        # Nov-Apr, so the summer-
                                                        # heatwave term is not accurate
                                                        # for this construct.
  warm_season:
    months: [6, 7, 8, 9]
    label_for_events: "warm_season_heatwave"
    note: "Out-of-season days set to non-candidate, which naturally prevents runs
           bridging the season gap (satisfies excluded_season_day_breaks_run)."
  primary_choice_status: "DEFERRED -- pick year-round vs warm-season as primary after
                          reviewing the side-by-side county-year summaries."

meteorological_data:
  source: "NOAA GHCN-Daily (temperature) + gridMET/METDATA (humidity)"   # [CONFIRMED]
  temporal_resolution: "daily"                        # [CONFIRMED] -- NOT hourly;
                                                       # this project has no hourly
                                                       # or dewpoint data. Spec's
                                                       # Part C hourly/grid steps
                                                       # (5-8) are SKIPPED entirely.
  temperature_variable: "tmax_f, tmin_f"
  dewpoint_variable: null                             # not available anywhere in
                                                       # this project
  relative_humidity_variable: "rmax_pct, rmin_pct (gridMET daily min/max RH)"
  coordinate_reference_system: "EPSG:4326"             # [INHERITED-DEFAULT] used
                                                       # by upstream extraction
  time_reference: "source_specific_non_equivalent_daily_windows"  # [DOCUMENTED
                                                       # 2026-07-16, review R2 Issue 10]
                                                       # GHCN TMAX/TMIN = per-station
                                                       # LOCAL observation day (non-
                                                       # uniform, unhomogenized, carries
                                                       # obs-time-lag flag L); gridMET
                                                       # rmax/rmin = fixed ~24h window
                                                       # ending ~1200 UTC. The two daily
                                                       # windows may NOT coincide. See
                                                       # quality_control/04_source_time_conventions.md.
  gridmet_day_endpoint_discrepancy: "UNRESOLVED -- ClimateEngine docs say 1200 UTC,
                                      Climatology Lab page says 0700 UTC (MST midnight);
                                      netCDF variable metadata not yet verified."

heat_metric:
  primary_metric: "derived_tmax_rhmin_hi_proxy_f"      # [RENAMED 2026-07-16, review
                                                       # Issue 1] -- a Tmax+RHmin
                                                       # PROXY, NOT a validated county
                                                       # daily-maximum heat index.
  pairing_convention: "Tmax paired with same-day RHmin"  # afternoon-pairing. NOTE
                                                       # (review Issue 1): components
                                                       # are NOT observed concurrently
                                                       # and have DIFFERENT spatial
                                                       # supports (GHCN station-based
                                                       # temperature vs. gridMET grid-
                                                       # mean humidity). Prior wording
                                                       # "already validated" WITHDRAWN
                                                       # -- it is an assumed
                                                       # approximation, not validated.
  time_convention_caveat: "GHCN uses per-station local observation day (unhomogenized);
                            gridMET rmax/rmin use a fixed ~24h window ending ~1200 UTC.
                            The two daily windows may not coincide -- see
                            quality_control/04_source_time_conventions.md (review Issue 7)."
  calculation_method: "NWS Rothfusz regression + low/high-humidity adjustment terms"
  formula_source: "gulf_eda/scripts/eda_util.py heat_index_f() -- corrected
                    2026-07-16, verified against wpc.ncep.noaa.gov"
  calculate_from_concurrent_hourly_values: false        # [CONFIRMED false] -- no
                                                        # hourly data exists

county_aggregation:                                    # [INHERITED, WITH AN
                                                        #  EXPLICIT DEVIATION FLAG]
  status: "NOT recomputed in this pilot -- inherited from existing upstream
           extraction (U_download_gulf_weather.py, V_download_gulf_gridmet.py).
           This is a KNOWN DEVIATION from the spec's Step 8 requirement
           (land-area-weighted grid intersection with water-fraction handling)."
  temperature_method_actually_used: "nearest-station / point-in-polygon county
                                      assignment of GHCN stations (NOT area-weighted)"
  humidity_method_actually_used: "unweighted mean of gridMET 4km grid-cell
                                    centroids falling inside the county polygon
                                    (point-in-polygon; NOT land-area-weighted;
                                    no explicit water-fraction exclusion)"
  heat_index_computed: "AFTER county-level T and RH aggregation (county-mean
                         inputs), NOT before, as the spec's own rule prefers.
                         Flagged as a known limitation, not silently corrected,
                         since fixing it would require reprocessing raw
                         station/grid data, out of scope for this pilot pass."

absolute_floor:                                        # review Issue 5 -- resolved:
                                                        # implement BOTH, decide later
  primary: "absolute_apparent_heat_floor_hi_ge_80f"     # PRIMARY: derived HI proxy >= 80F
                                                        # (an apparent-heat floor). Column
                                                        # floor_hi_ge_80. Renamed away from
                                                        # the misleading
                                                        # "minimum_valid_temperature_f".
  sensitivity: "heat_index_formula_domain_tmax_ge_80f"  # SENSITIVITY: Tmax >= 80F (the NWS
                                                        # heat-index formula's domain of
                                                        # validity). Column domain_tmax_ge_80.
                                                        # 111 more candidate days than
                                                        # primary, concentrated in the arid
                                                        # counties (El Paso, Lubbock).
  note: "Both computed as separate flags; events built under each. Which becomes THE
         definition is deferred pending your review of the side-by-side impact."

relative_threshold:
  percentile: 0.85                                     # [INHERITED-DEFAULT]
                                                        # matches both the spec's
                                                        # own default and existing
                                                        # project convention
  comparison_operator: ">"                              # [NEEDS USER DECISION /
                                                        # FLAGGED CONFLICT] -- the
                                                        # spec's Step 13 literally
                                                        # specifies strict ">"; the
                                                        # EXISTING gulf_eda pipeline
                                                        # uses ">=" (build_thresholds
                                                        # _and_flags.py line 133).
                                                        # This pilot uses the
                                                        # spec's literal ">" --
                                                        # confirm this is intended.
  threshold_type: "county-calendar-day"                 # [CONFIRMED] switched from
                                                        # month-bucket per your answer
  calendar_window_days: 31                              # [CONFIRMED] centered +/-15
  quantile_method: "linear interpolation (numpy/pandas default)"  # [INHERITED-DEFAULT]
  use_fixed_reference_period: false                    # primary method is walk-forward

persistence:
  minimum_consecutive_days: 2                          # [INHERITED-DEFAULT] matches
                                                        # spec + existing convention
  missing_day_breaks_run: true                         # [CONFIRMED by spec, matches
                                                        # existing pipeline behavior]
  excluded_season_day_breaks_run: true                  # [ACTIVE for warm-season scenario,
                                                        # updated 2026-07-16 review R2 Issue 13]
                                                        # In the Jun-Sep scenario, out-of-
                                                        # season days are set non-candidate
                                                        # BEFORE run construction, so a run
                                                        # cannot bridge the Oct-May gap.
                                                        # (Not applicable to the year-round
                                                        # scenarios, which have no excluded season.)
  year_boundary_breaks_run: false                       # [NEEDS USER DECISION before statewide
                                                        # expansion] -- kept false (matches
                                                        # existing gulf_eda). No event in this
                                                        # pilot crosses Dec31->Jan1, so it has
                                                        # zero effect here. Under the year-round
                                                        # anomaly construct, cross-year winter
                                                        # events ARE plausible statewide; before
                                                        # expansion choose: break at Dec31, OR
                                                        # keep the physical event but allocate
                                                        # event-days per county-year, OR assign
                                                        # the whole event to its onset year.
                                                        # Must align with county-year summaries.
  comparison_operator_note: "pilot uses spec-literal '>'; no daily proxy value equals its
                             threshold exactly, so '>' and '>=' give identical pilot output.
                             Standardize vs existing gulf_eda '>=' before expansion."

absolute_thresholds_f:
  heat_index: [85,90, 95, 100, 103]                            # [CONFIRMED] matches spec;
                                                        # 103 also matches this
                                                        # project's own prior
                                                        # absolute-companion choice
  maximum_temperature: [95, 100]                        # [CONFIRMED] matches spec

quality_control:
  qc_status_levels: ["valid", "suspicious_retain", "invalid_missing"]  # review Issue 2
  # valid             = clean
  # suspicious_retain = implausible but not impossible (e.g. RH pinned at 100%,
  #                     zero diurnal RH range, HI jump unexplained by Tmax);
  #                     KEPT and flagged, propagated into county_daily_quality_flag
  # invalid_missing   = physically impossible (Tmax<Tmin, RH out of 0-100) OR
  #                     proxy uncomputable; offending field set to NaN
  scenario_reruns: "step03 builds events under retain-all (PRIMARY), suspicious->missing,
                    warm-season, and Tmax-floor, so the influence of the 50 suspicious
                    and 11 missing county-days on event existence/severity is quantified,
                    not hidden."
  minimum_valid_hours_per_day: null                     # N/A -- no hourly data
  minimum_reference_observations_per_threshold: 20      # [NEEDS USER DECISION] --
                                                        # spec marks this [CONFIGURE]
                                                        # itself (unresolved in the
                                                        # spec you pasted, not just
                                                        # in this project). Proposed
                                                        # default: >=20 reference-
                                                        # period obs required for a
                                                        # county-calendar-day
                                                        # threshold to be trusted.
                                                        # A 31-day window x 36+
                                                        # baseline years normally
                                                        # yields 800+, so this floor
                                                        # should rarely bind except
                                                        # near the very first
                                                        # analysis years. Confirm.
  water_fraction_exclusion_threshold: null              # N/A -- not recomputing
                                                        # spatial intersection
                                                        # in this pilot
  retain_quality_flags: true
